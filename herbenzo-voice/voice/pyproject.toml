[project]
name = "herbenzo-voice-controller"
version = "0.1.0"
description = "Herbenzo voice controller: WebRTC + Riva ASR/TTS (NVIDIA ACE Controller / Pipecat) in front of the intake agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    # NVIDIA ACE Controller SDK, branch develop-health, pinned to the commit the ambient-patient blueprint uses.
    "nvidia-pipecat @ git+https://github.com/NVIDIA/ace-controller.git@cf371f0670b45ac387229259e43d6d56d78546e5",
    "aiortc>=1.13.0",
    "opencv-python-headless>=4.11.0.86",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.22", "ruff>=0.11"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["config", "herbenzo_agent_service", "pipeline_herbenzo", "websocket_transcript_output"]
